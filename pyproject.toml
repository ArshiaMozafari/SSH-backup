[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-state-backup"
version = "0.1.0"
description = "Capture system and network state from remote Windows hosts over SSH"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4"]

[project.scripts]
ssh-backup = "backup.cli:main"

[tool.setuptools.packages.find]
include = ["backup*"]